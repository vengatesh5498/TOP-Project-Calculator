<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <div class="display">
        <output id="calc-screen">0</output>
      </div>
      <div class="all-buttons">
        <!-- Row 1 -->
        <button data-type="clear" id="clear">AC</button>
        <button data-type="operator" id="/">/</button>
        <!-- Row 2 -->
        <button data-type="number" id="7">7</button>
        <button data-type="number" id="8">8</button>
        <button data-type="number" id="9">9</button>
        <button data-type="operator" id="*">*</button>
        <!-- Row 3-->
        <button data-type="number" id="4">4</button>
        <button data-type="number" id="5">5</button>
        <button data-type="number" id="6">6</button>
        <button data-type="operator" id="-">-</button>
        <!-- Row 4 -->
        <button data-type="number" id="1">1</button>
        <button data-type="number" id="2">2</button>
        <button data-type="number" id="3">3</button>
        <button data-type="operator" id="+">+</button>
        <!-- Row 5 -->
        <button data-type="number" id="0">7</button>
        <button data-type="number" id=".">8</button>
        <button data-type="number" id="=">=</button>
      </div>
      <!-- Buttons Container Ends Here -->
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
